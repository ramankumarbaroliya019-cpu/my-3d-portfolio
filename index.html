<!-- Multi-Tab Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 relative shadow-2xl max-h-[90vh] flex flex-col">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Admin Login View (No default password hint displayed) -->
            <div id="admin-login-view" class="my-auto">
                <h3 class="text-xl font-bold mb-4"><i class="fa-solid fa-lock text-blue-500 mr-2"></i> Admin Authentication</h3>
                <p class="text-slate-400 text-sm mb-6">Enter your security password to access control panel.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Security Password</label>
                        <input type="password" id="admin-pass-input" placeholder="Enter password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="authenticateAdmin()" class="w-full gradient-btn font-semibold py-3 rounded-xl transition">Login to Panel</button>
                </div>
            </div>

            <!-- Admin Dashboard View -->
            <div id="admin-dashboard-view" class="hidden flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                    <h3 class="text-xl font-bold text-white"><i class="fa-solid fa-sliders text-blue-500 mr-2"></i> Admin Control Panel</h3>
                    <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">Logout</button>
                </div>

                <!-- Admin Tab Bar -->
                <div class="flex border-b border-slate-800 mb-4 overflow-x-auto gap-2 pb-2">
                    <button onclick="switchAdminTab('profile')" id="tab-btn-profile" class="admin-tab-btn active-admin-tab text-xs font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap">
                        <i class="fa-solid fa-user-gear mr-1"></i> Profile & Photo
                    </button>
                    <button onclick="switchAdminTab('about')" id="tab-btn-about" class="admin-tab-btn text-xs font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap bg-slate-950 text-slate-400">
                        <i class="fa-solid fa-graduation-cap mr-1"></i> Qualifications & Skills
                    </button>
                    <button onclick="switchAdminTab('3d')" id="tab-btn-3d" class="admin-tab-btn text-xs font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap bg-slate-950 text-slate-400">
                        <i class="fa-solid fa-cube mr-1"></i> 3D Models
                    </button>
                    <button onclick="switchAdminTab('book')" id="tab-btn-book" class="admin-tab-btn text-xs font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap bg-slate-950 text-slate-400">
                        <i class="fa-solid fa-book mr-1"></i> Books & Guides
                    </button>
                    <button onclick="switchAdminTab('ppt')" id="tab-btn-ppt" class="admin-tab-btn text-xs font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap bg-slate-950 text-slate-400">
                        <i class="fa-solid fa-file-powerpoint mr-1"></i> PPTs & Files
                    </button>
                </div>

                <!-- Tab Contents -->
                <div class="overflow-y-auto pr-2 space-y-4 flex-1">
                    <!-- Profile Tab (With Password Change Option) -->
                    <div id="admin-tab-profile" class="admin-tab-content space-y-4">
                        <h4 class="text-sm font-semibold text-blue-400">Profile Photo & Contacts</h4>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Profile Image URL (अपनी फोटो का लिंक)</label>
                            <input type="text" id="admin-input-photo" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Full Name</label>
                            <input type="text" id="admin-input-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Tagline / Subtitle</label>
                            <input type="text" id="admin-input-tagline" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">UPI ID (For dynamic QR payment)</label>
                            <input type="text" id="admin-input-upi" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">WhatsApp / Phone</label>
                                <input type="text" id="admin-input-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Gmail Address</label>
                                <input type="text" id="admin-input-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                            </div>
                        </div>

                        <!-- Security Password Change Section -->
                        <div class="pt-4 border-t border-slate-800">
                            <h4 class="text-sm font-semibold text-pink-400 mb-2"><i class="fa-solid fa-key mr-1"></i> Change Admin Password</h4>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">New Password</label>
                                <input type="password" id="admin-input-newpass" placeholder="Enter new password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-pink-500">
                            </div>
                        </div>

                        <button onclick="saveProfileSettings()" class="w-full gradient-btn font-semibold py-3 rounded-xl transition text-sm">Save Profile & Password</button>
                    </div>

                    <!-- About & Qualifications Tab -->
                    <div id="admin-tab-about" class="admin-tab-content hidden space-y-4">
                        <h4 class="text-sm font-semibold text-blue-400">Manage Education, Skills & Certificates</h4>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Education Details</label>
                            <textarea id="admin-input-education" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">3D & Tech Skills</label>
                            <textarea id="admin-input-skills" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Certifications</label>
                            <textarea id="admin-input-cert" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
                        </div>
                        <button onclick="saveAboutSettings()" class="w-full gradient-btn font-semibold py-3 rounded-xl transition text-sm">Save Qualifications & Skills</button>
                    </div>

                    <!-- 3D Models Tab -->
                    <div id="admin-tab-3d" class="admin-tab-content hidden space-y-4">
                        <h4 class="text-sm font-semibold text-blue-400">Upload New 3D Model</h4>
                        <input type="text" id="add-3d-title" placeholder="3D Model Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="number" id="add-3d-price" placeholder="Price (₹)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <textarea id="add-3d-desc" rows="2" placeholder="Description" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm"></textarea>
                        <input type="text" id="add-3d-image" placeholder="Image URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="text" id="add-3d-file" placeholder="Google Drive File Link" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <button onclick="addNewProductByCategory('3d')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition text-sm">Publish 3D Model</button>
                    </div>

                    <!-- Books Tab -->
                    <div id="admin-tab-book" class="admin-tab-content hidden space-y-4">
                        <h4 class="text-sm font-semibold text-blue-400">Upload New Book / Guide</h4>
                        <input type="text" id="add-book-title" placeholder="Book Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="number" id="add-book-price" placeholder="Price (₹)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <textarea id="add-book-desc" rows="2" placeholder="Description" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm"></textarea>
                        <input type="text" id="add-book-image" placeholder="Cover Image URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="text" id="add-book-file" placeholder="E-book Download Link" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <button onclick="addNewProductByCategory('book')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition text-sm">Publish Book</button>
                    </div>

                    <!-- PPTs Tab -->
                    <div id="admin-tab-ppt" class="admin-tab-content hidden space-y-4">
                        <h4 class="text-sm font-semibold text-blue-400">Upload New PPT / Digital File</h4>
                        <input type="text" id="add-ppt-title" placeholder="Presentation / File Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="number" id="add-ppt-price" placeholder="Price (₹)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <textarea id="add-ppt-desc" rows="2" placeholder="Description" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm"></textarea>
                        <input type="text" id="add-ppt-image" placeholder="Preview Image URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <input type="text" id="add-ppt-file" placeholder="File Download Link" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm">
                        <button onclick="addNewProductByCategory('ppt')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition text-sm">Publish Digital File</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
